# render.yaml — Deploy signaling server to Render.com (free tier)
# Uses Render's native Node.js runtime (no Docker needed).
# Push this repo to GitHub, then on Render: New → Blueprint Instance → connect this repo.

services:
  - type: web
    name: together-signaling
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 10000
    healthCheckPath: /health
