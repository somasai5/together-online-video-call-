<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Together — Watch Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header id="header">
      <img src="icons/icon48.png" alt="Together logo" id="logo" />
      <div>
        <h1 id="app-title">Together</h1>
        <p id="app-subtitle">Hotstar Watch Party</p>
      </div>
    </header>

    <!-- Status bar -->
    <div id="status-bar">
      <span id="status-dot" class="dot disconnected"></span>
      <span id="status-text">Not connected</span>
    </div>

    <!-- Main content (screens swap via JS) -->
    <main id="main">

      <!-- Screen: Lobby (create / join) -->
      <div id="screen-lobby" class="screen active">
        <button id="btn-create" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create Room
        </button>

        <div id="divider"><span>or</span></div>

        <div id="join-section">
          <label for="input-room-code" class="label">Room Code</label>
          <div id="join-row">
            <input
              id="input-room-code"
              type="text"
              maxlength="6"
              placeholder="XXXXXX"
              autocomplete="off"
              spellcheck="false"
            />
            <button id="btn-join" class="btn btn-secondary">Join</button>
          </div>
          <p id="join-error" class="error-text hidden"></p>
        </div>
      </div>

      <!-- Screen: Room (after create/join) -->
      <div id="screen-room" class="screen">
        <div id="room-code-card">
          <p id="room-code-label">Room Code</p>
          <p id="room-code-value">———</p>
          <button id="btn-copy" class="btn btn-ghost btn-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>

        <div id="participants-section">
          <p class="label">Participants</p>
          <div id="participant-list">
            <div class="participant-item">
              <span class="dot connected"></span>
              <span id="my-label">You (<span id="my-role">Guest</span>)</span>
            </div>
            <div class="participant-item" id="peer-item" style="opacity:0.4">
              <span class="dot" id="peer-dot"></span>
              <span id="peer-label">Waiting for friend…</span>
            </div>
          </div>
        </div>

        <p id="room-hint" class="hint">Share the code with your friend. Open Hotstar in this tab to start watching.</p>

        <button id="btn-leave" class="btn btn-danger btn-sm">Leave Room</button>
      </div>

    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
